name: 追蹤降價

# 排程目前交給 Claude 的定時任務（每小時，實測準時）。
# GitHub 的 cron 在這個 repo 設好五小時都沒觸發過，不可靠，
# 因此停用排程只保留手動觸發，避免日後突然雙重通知。
on:
  workflow_dispatch:
    inputs:
      force:
        description: 不論有無降價都推播一則測試通知
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 查詢，降價就推播到手機
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m tracker ${{ inputs.force && '--force' || '' }}

      - name: 把最新狀態存回 repo
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: 更新價格紀錄"
            git push
          else
            echo "價格沒變，不用寫入。"
          fi
