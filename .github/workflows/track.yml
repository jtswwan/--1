name: 追蹤降價

on:
  schedule:
    - cron: "17 * * * *"   # 每小時查一次（避開整點，整點排隊最塞）
  workflow_dispatch:
    inputs:
      force:
        description: 不論有無降價都開一張通知 issue（測試用）
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: price-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 不用設信箱：有降價就開一張 issue，GitHub 會寄信＋推播到 GitHub App 給 repo 擁有者。
      - name: 查詢價格
        id: check
        run: |
          set +e
          python -m tracker --no-email ${{ inputs.force && '--force' || '' }} 2>&1 | tee out.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 有降價就開 issue 通知
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          alerts=$(grep '^NOTIFY: ' out.txt | grep -v '^NOTIFY: none$' || true)
          if [[ -z "$alerts" ]]; then
            echo "沒有降價，不通知。"
            exit 0
          fi
          {
            echo "@${{ github.repository_owner }} 降價了，詳情如下（「+」開頭的是這個價位用得到的券，要自己去領）："
            echo
            echo '```'
            cat out.txt
            echo '```'
          } > body.md
          first=$(head -1 <<<"$alerts")
          title="${first:8:60}"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "降價通知：$title" --body-file body.md

      - name: 把最新狀態存回 repo
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: 更新價格紀錄"
            git pull --rebase -X theirs
            git push
          else
            echo "價格沒變，不用寫入。"
          fi

      # 抓不到頁面或解析失敗時讓這次執行失敗，GitHub 會寄失敗通知信。
      - name: 查詢失敗
        if: steps.check.outputs.code != '0'
        run: exit 1
